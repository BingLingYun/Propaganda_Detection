model_type: ts_pipeline
model_name: FacebookAI/xlm-roberta-base
tokenizer_use_fast: true

max_length: 512
stride: 128
dropout: 0.1
pos_weight_cap: 20.0
nms_iou: 0.5

stage1:
  model_type: ts_proposal
  proposal_architecture: bilou_token_tagger
  proposal_positive_weight: 4.0
  max_proposals_per_document: 200
  target_dev_recall: 0.95
  threshold_grid:
    start: 0.10
    stop: 0.90
    step: 0.05

stage2:
  model_type: ts_classifier
  stage2_architecture: zen_selected_span
  stage2_input_mode: selected_span_context
  head_architecture: independent
  include_gold_candidates: true
  sentence_context_sentences: 0
  positive_overlap_mode: gold_coverage
  positive_iou_threshold: 0.5
  negative_iou_threshold: 0.1
  classifier_lr: 1.0e-5
  epochs: 14
  threshold_grid:
    start: 0.10
    stop: 0.90
    step: 0.05

encoder_lr: 2.0e-5
task_lr: 1.0e-3
batch_size: 4
grad_accumulation: 4
fp16: true
weight_decay: 0.01
warmup_ratio: 0.1
grad_clip: 1.0
epochs: 10
early_stopping_patience: 3
selection_metric: dev_partial_micro_f1
